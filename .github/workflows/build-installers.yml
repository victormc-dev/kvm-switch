name: 构建全平台安装包

# 推送到 main（auto-release.sh 提交后即触发）或打 v* 标签时，
# 在 Windows / macOS / Linux 三个 runner 上并行构建安装包并上传为 Artifact。
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: 构建 ${{ matrix.name }} 安装包
    strategy:
      fail-fast: false   # 单个平台失败不影响其余平台
      matrix:
        include:
          # 用 windows-2022：自带 VS2022(v17)，node-gyp 可识别；
          # windows-latest 已升级到 VS2026(v18)，node-gyp 找不到会编译失败
          - os: windows-2022
            name: windows
            args: --win
          - os: macos-latest
            name: macos
            args: --mac
          - os: ubuntu-latest
            name: linux
            args: --linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装 Linux 构建依赖
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg libudev-dev libusb-1.0-0-dev libfuse2

      - name: 安装 npm 依赖
        run: npm ci

      # Windows 源码编译原生模块需要 MSVC（node-gyp 找不到 VS 会失败）
      - name: 初始化 MSVC 编译环境 (Windows)
        if: matrix.os == 'windows-2022'
        uses: ilammy/msvc-dev-cmd@v1

      # runner 自带 Python 3.12 移除了 distutils，node-gyp 需要它；
      # 三个平台统一固定到 3.11，避免 Windows/macOS 源码编译原生模块失败
      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 原生依赖：node-hid / serialport 必须按 Electron 的 ABI 重编译，
      # 否则运行时报 NODE_MODULE_VERSION 不匹配。install-app-deps 会优先
      # 下载匹配 Electron 的 prebuilt，取不到再本地源码编译。
      - name: 为 Electron 重编译原生模块
        run: npx electron-builder install-app-deps

      - name: 编译前端/主进程
        run: npm run build

      - name: 打包 ${{ matrix.name }} 安装包
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # 无签名证书时跳过 macOS 签名
        run: npx electron-builder ${{ matrix.args }} --publish never

      - name: 上传安装包 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kvm-switch-${{ matrix.name }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 30

  # 三平台构建全部成功后，自动创建 GitHub Release 并上传安装包。
  # 版本号取自 package.json（auto-release.sh 推送前已 patch +1），
  # 因此每次 push main 都会发布一个新版本，无需手动打 tag。
  release:
    name: 发布 Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 创建 Release / tag / 上传资产
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 Node.js（读取版本号）
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 下载三平台安装包 Artifact
        uses: actions/download-artifact@v4
        with:
          pattern: kvm-switch-*
          path: artifacts

      - name: 收集安装包资产
        id: assets
        run: |
          mapfile -d '' files < <(find artifacts -type f \
            \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \) \
            -print0)
          printf '找到 %d 个安装包\n' "${#files[@]}"
          printf '%s\n' "${files[@]}"
          # 用 NUL 分隔写入环境文件，兼容含空格的文件名
          {
            echo 'files<<EOF'
            printf '%s\n' "${files[@]}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: 创建 Release 并上传安装包
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSETS: ${{ steps.assets.outputs.files }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          echo "发布版本: $TAG"

          mapfile -t files <<< "$ASSETS"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，更新资产"
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            echo "创建新 Release $TAG"
            gh release create "$TAG" "${files[@]}" \
              --title "$TAG" \
              --generate-notes
          fi

          echo "发布完成: https://github.com/${{ github.repository }}/releases/tag/$TAG"
